<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane Build</title>
  <style>
    :root {
      --bg: #060611;
      --bg2: #0a0a17;
      --panel: #0d0d1e;
      --panel-2: #101028;
      --line: #1d1d33;
      --line-2: #292948;
      --text: #efe7d4;
      --muted: #8d8da7;
      --gold: #d4a017;
      --danger: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #111128 0%, var(--bg) 45%, #04040b 100%);
      color: var(--text);
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(6,6,17,.92);
      backdrop-filter: blur(10px);
    }
    .brand { font-weight: 800; letter-spacing: .08em; color: var(--gold); }
    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
    .seg button, .btn {
      background: transparent; color: var(--muted); border: 0; cursor: pointer;
      padding: 7px 12px; font-size: 12px;
    }
    .seg button.active { background: var(--gold); color: #000; font-weight: 700; }
    .btn { border: 1px solid var(--line-2); border-radius: 8px; }
    .btn.success { color: var(--success); background: #081808; }
    .btn.danger { color: var(--danger); background: #180808; }
    .btn.gold { color: var(--gold); background: #1d1604; }
    .spacer { flex: 1 1 auto; }
    .budget-wrap, .xpbox { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    input[type="number"] {
      width: 72px; padding: 6px 8px; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line-2); border-radius: 8px;
    }
    .layout {
      display: grid; grid-template-columns: 380px minmax(420px, 1fr) 360px;
      gap: 16px; padding: 16px; max-width: 1800px; margin: 0 auto;
    }
    .panel {
      background: linear-gradient(180deg, rgba(14,14,34,.95), rgba(9,9,22,.95));
      border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.28);
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700;
    }
    .panel-body { padding: 14px 16px; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
      justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
    }
    .modal-box {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .gh-label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    .gh-input {
      width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px;
    }
    .gh-status { font-size: 12px; min-height: 16px; margin-top: 10px; color: var(--muted); }
    .gh-status.ok { color: var(--success); }
    .gh-status.err { color: var(--danger); }
    .gh-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
    .gh-item { text-align: left; width: 100%; font-size: 13px; color: var(--text); background: var(--panel-2); }
    .gh-item:hover { border-color: var(--gold); }
    .svg-wrap { padding: 8px; }
    svg { width: 100%; height: auto; display: block; }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .title { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .req {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
      border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px;
    }
    .warn { color: #fbbf24; margin-top: 12px; font-size: 13px; }
    .level-row { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
    .lvbtn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2);
      background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 21px; font-weight: 700;
    }
    .lvbtn:disabled { opacity: .35; cursor: not-allowed; }
    .level-box { min-width: 82px; text-align: center; font-size: 18px; font-weight: 800; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 16px; }
    .stat {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    }
    .stat .v { font-size: 22px; font-weight: 800; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .acq-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 9px 13px; background: transparent; border: 0; color: var(--text); cursor: pointer;
      border-bottom: 1px solid #0f0f20;
    }
    .acq-item:hover { background: rgba(255,255,255,.02); }
    .badge { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 4px 8px; }
    .small { font-size: 12px; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
    .legend .badge { border: 1px solid transparent; }
    .collapsible-header { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
    .collapsible-header:first-child { border-top: 0; }
    .collapsible-header:hover { color: var(--text); }
    .chevron { font-size: 10px; transition: transform .15s ease; }
    .proj-type-btn { border-radius: 8px; }
    .proj-node-text { pointer-events: none; }
    @media (max-width: 1250px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">✦ ARCANE BUILD</div>
    <div class="seg">
      <button id="modePlanning" class="active">⚡ Planification</button>
      <button id="modeBudget">🎯 Budget</button>
    </div>
    <div id="budgetWrap" class="budget-wrap" style="display:none;">
      <span>Budget XP :</span>
      <input id="budgetInput" type="number" min="0" value="50" />
      <span id="budgetLeft"></span>
    </div>
    <div class="spacer"></div>
    <div class="xpbox">XP : <strong id="xpSpent">0</strong> <span id="xpModeHint">(illimité)</span></div>
    <div class="xpbox">HP : <strong id="hpTotal">0</strong></div>
    <button id="saveBtn" class="btn gold">💾 Sauver</button>
    <button id="loadBtn" class="btn success">📂 Charger</button>
    <button id="ghSaveBtn" class="btn gold" title="Enregistrer dans le dépôt GitHub">☁️ Sauver GitHub</button>
    <button id="ghLoadBtn" class="btn success" title="Charger depuis le dépôt GitHub">☁️ Charger GitHub</button>
    <button id="ghCfgBtn" class="btn" title="Token GitHub">🔑</button>
    <button id="resetBtn" class="btn danger">🗑 Reset</button>
    <input id="fileInput" type="file" accept="application/json" hidden />
  </div>

  <div class="layout">
    <section class="panel">
      <div class="panel-header">DÉTAILS</div>
      <div class="panel-body" id="detailPanel"></div>
    </section>

    <section class="panel">
      <div class="panel-header">CERCLES ARCANIQUES</div>
      <div class="svg-wrap"><svg id="arcaneSvg" viewBox="0 0 980 980" aria-label="Carte des magies"></svg></div>
      <div class="panel-header" style="border-top:1px solid var(--line);">HISTORIQUE</div>
      <div class="panel-body" style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
        <div style="flex:1 1 75%; min-width:260px;">
          <table id="improvementsTable" style="width:100%; border-collapse:collapse; font-size:13px;"></table>
          <button id="addImprovementBtn" class="btn success" style="font-size:12px;width:100%;margin-top:10px;">+ Ajouter une amélioration</button>
        </div>
        <div style="flex:1 1 20%; min-width:150px;">
          <table id="statsTotalsTable" style="width:100%; border-collapse:collapse; font-size:13px;"></table>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header collapsible-header" id="magicsHeader">
        <span>MAGIES ACQUISES</span><span class="chevron" id="magicsChevron">▾</span>
      </div>
      <div id="magicsBody">
        <div class="panel-body" id="acquiredMeta"></div>
        <div id="acquiredList"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel-header collapsible-header" id="projectsHeader">
        <span>PROJETS</span><span class="chevron" id="projectsChevron">▾</span>
      </div>
      <div id="projectsBody">
        <div class="panel-body" id="projectsMeta"></div>
        <div id="projectsList"></div>
      </div>
    </section>
  </div>

<script>
// ─── Magic data faithfully matching the arcane wheel image ───
// Angles are measured clockwise from top (North = 0°)
// Prereqs read from the image for each magic.
const RAW_CIRCLES = [
  { circle: 1, magics: [
    { id: "magic", name: "Magie", prereqs: [] },
  ]},
  { circle: 2, magics: [
    // image: Elemental (top), Focus (right), Arcane (bottom), Balance (left)
    { id: "elemental", name: "Elemental", prereqs: ["magic"] },
    { id: "focus",     name: "Focus",     prereqs: ["magic"] },
    { id: "arcane",    name: "Arcane",    prereqs: ["magic"] },

  { circle: 3, magics: [
    { id: "fire",          name: "Fire",          prereqs: ["elemental"] },

    { id: "sky",           name: "Sky",           prereqs: ["elemental"] },
    { id: "earth",         name: "Earth",         prereqs: ["elemental"] },
    { id: "alchemy",       name: "Alchemy",       prereqs: ["focus"] },

  { circle: 4, magics: [

    { id: "gravity",       name: "Gravity",      prereqs: ["earth", "air"] },
    { id: "entropy",       name: "Entropy",      prereqs: ["earth", "water", "fire", "sky"] },
    { id: "cartomancy",    name: "Cartomancie",  prereqs: ["astrology", "enchantment"] },

    { id: "void",          name: "Void",         prereqs: ["air", "negamagic"] },
    { id: "necromancy",    name: "Necromancy",   prereqs: ["voodoo", "darkness"] },
    { id: "madness",       name: "Madness",      prereqs: ["psionism", "illusions"] },
    { id: "abysse",        name: "Abysse",       prereqs: ["darkness", "pact"] },
    { id: "life",          name: "Life",         prereqs: ["light", "nature"] },
    { id: "domination",    name: "Domination",   prereqs: ["nature"] },
    { id: "beast_magic",   name: "Beast Magic",  prereqs: ["nature"] },
    { id: "hivemind",      name: "Hivemind",     prereqs: ["nature"] },
  ]},
  { circle: 6, magics: [
    { id: "spiritualism", name: "Spiritualism", prereqs: ["necromancy", "life"] },

    { id: "imagination",  name: "Imagination",  prereqs: ["madness", "transmutation"] },
    { id: "fae",          name: "Fae",          prereqs: ["life", "illusions", "pact"] },
  ]},
];

// ─── Project tree (mutation / familier / artefact) ───
// Structure faithfully reproduces the provided diagram (START → 3 → 3 → 3 → 3 → U),
// with branching that is sometimes 2-way and sometimes 3-way, exactly as drawn.
const PROJECT_TREE = {
  start:  { label: 'START',  row: 0, col: 0,  next: ['c1', 'b1', 'e1'] },
  c1:     { label: 'C',      row: 1, col: -1, next: ['b2l'] },
  b1:     { label: 'B',      row: 1, col: 0,  next: ['b2l', 'e2', 'b2r'] },
  e1:     { label: 'E',      row: 1, col: 1,  next: ['b2r'] },
  b2l:    { label: 'B',      row: 2, col: -1, next: ['c3l', 'f3'] },
  e2:     { label: 'E',      row: 2, col: 0,  next: ['c3l', 'c3r'] },
  b2r:    { label: 'B',      row: 2, col: 1,  next: ['f3', 'c3r'] },
  c3l:    { label: 'C',      row: 3, col: -1, next: ['bc4', 'core4'] },
  f3:     { label: 'F',      row: 3, col: 0,  next: ['core4'] },
  c3r:    { label: 'C',      row: 3, col: 1,  next: ['core4', 'be4'] },
  bc4:    { label: 'BC',     row: 4, col: -1, next: ['u'] },
  core4:  { label: 'C ou E', row: 4, col: 0,  next: ['u'] },
  be4:    { label: 'BE',     row: 4, col: 1,  next: ['u'] },
  u:      { label: 'U',      row: 5, col: 0,  next: [] },
};
const PROJECT_TYPES = {
  mutation: { label: 'Mutation', icon: '', color: '#22c55e' },
  familier: { label: 'Familier', icon: '', color: '#0ea5e9' },
  artefact: { label: 'Artefact', icon: '', color: '#d4a017' },
};
let newProjectDraft = { name: '', type: 'mutation', magicId: '', description: '', familierStats: [] };
let showNewProjectModal = false;
const FAMILIER_STATS = ['Brutality', 'Sturdiness', 'Swiftness', 'Cunning', 'Empathy', 'Rhetoric', 'Curiosity'];
// ─── Sortie de schéma (hors-arbre, avec accord MJ) ───
let showExitSchemaConfirm = null; // projectId ou null
let showNewOffSchemaModal = null; // projectId ou null
let newOffSchemaItemDraft = { letter: '', description: '' };
const OFF_SCHEMA_LETTERS = [['B', 'Bonus'], ['C', 'Customization'], ['E', 'Extension'], ['F', 'Formfitting']];
let showDeleteProjectConfirm = null; // projectId ou null
// ─── Améliorations (bonus libres associés à 2 stats) ───
let newImprovementDraft = { description: '', stats: [] };
let showNewImprovementModal = false;
const IMPROVEMENT_BONUS = 5; // valeur ajoutée à chaque stat choisie par amélioration

const ALL_MAGICS = {};
RAW_CIRCLES.forEach(({ circle, magics }) => magics.forEach((m) => ALL_MAGICS[m.id] = { ...m, circle }));

// Angles in degrees clockwise from North (top=0°), evenly spaced per ring, order preserved from image.
const MAGIC_DEG = {
  // C1
  magic: 0,
  // C2 — 4 cardinal positions
  elemental:  0,
  focus:      90,
  arcane:     180,
  balance:    270,
  // C3 — 13 magics evenly spaced (360/13 ≈ 27.7°), starting fire at 346°
  fire:           346,
  water:           14,
  sky:             41,
  alchemy:         69,
  enchantment:     97,
  metamorphosis:  124,
  ancestral:      152,
  pact:           180,
  mana:           208,
  darkness:       235,
  illusions:      263,
  light:          291,
  earth:          318,
  // C4 — 15 magics, placed near their C3 prereqs to minimise line crossings
  mist:           357,  // near fire(346) + water(14)
  ice:             14,  // equidistant mist(357) et air(30) — écart ~16° de chaque côté
  air:             30,  // near sky(41) — remonté de 20° (espace air-ice réduit de 2/3)
  astrology:       50,  // near sky(41) + focus(90) — remonté de 20°
  lightning:       70,  // near sky(41) — remonté de 20°
  morphism:       109,  // near metamorphosis(124), shifted to halve gap with lightning(90)
  shamanism:      136,  // near ancestral(152)
  runes:          153,  // near ancestral(152)
  voodoo:         171,  // near ancestral(152)
  mycology:       188,  // near pact(180)
  negamagic:      211,  // near mana(208) + darkness(235)
  psionism:       236,  // near mana(208) + illusions(263)
  lithomancy:     278,  // near illusions(263) + earth(318)
  nature:         315,  // near earth(318)
  seismic:        336,  // equidistant mist(357) et nature(315) — écart 21° de chaque côté
  // C5 — 14 magics, placed near their C4/C3 prereqs to minimise line crossings
  gravity:        358,  // near air(50) + seismic(340) — wraps over top
  entropy:         22,  // near fire(346)/water(14)/sky(41)/earth(318) cluster
  cartomancy:      55,  // C5 — entre entropy(22) et metal(72) à 2/3 depuis entropy
  metal:           72,  // near lightning(90) + earth zone
  transmutation:   90,  // near alchemy(C3=69)
  pain:           106,  // near morphism(109)
  blood:          122,  // near morphism(109) + water zone
  demonology:     148,  // espace demonology-seraph = seraph-necromancy (18°)
  seraph:         166,  // equidistant demonology(148) et necromancy(184) — 18° de chaque côté
  abysse:         200,  // repositionné
  void:           219,  // repositionné
  necromancy:     184,  // near voodoo(171) + darkness(235)
  madness:        242,  // repositionné
  life:           287,  // espacement égal 17° avec domination
  domination:     304,  // espacement égal 17° (life→dom→beast→hivemind)
  beast_magic:    321,  // espacement égal 17° avec hivemind(338)
  hivemind:       338,  // near nature(315)
  // C6 — 3 magics evenly spaced (120°)
  spiritualism:   0,
  space_time:     120,
  imagination:    240,
  fae:            264,  // espace fae-imagination réduit de 60% (60°→24°)
};
delete MAGIC_DEG['ancestral_sh'];
const SZ = 980, CX = 490, CY = 490;
const RING_R = { 1: 0, 2: 72, 3: 158, 4: 245, 5: 332, 6: 415 };
const SEP_R = [36, 115, 202, 288, 374, 450];
const TH = {
  1: { c: "#d4a017", t: "#ffe88a", bg: "#1e1600", lbl: "Cercle I" },
  2: { c: "#e2c97e", t: "#fff5d0", bg: "#1c1a0c", lbl: "Cercle II" },
  3: { c: "#a855f7", t: "#d8b4fe", bg: "#140020", lbl: "Cercle III" },
  4: { c: "#0ea5e9", t: "#7dd3fc", bg: "#001828", lbl: "Cercle IV" },
  5: { c: "#22c55e", t: "#86efac", bg: "#001e08", lbl: "Cercle V" },
  6: { c: "#ef4444", t: "#fca5a5", bg: "#200000", lbl: "Cercle VI" },
};
function degToPos(deg, r) {
  if (r === 0) return { x: CX, y: CY };
  const rad = ((deg - 90) * Math.PI) / 180;
  return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
}
const POSITIONS = {};
RAW_CIRCLES.forEach(({ circle, magics }) => {
  const r = RING_R[circle];
  magics.forEach((m) => POSITIONS[m.id] = degToPos(MAGIC_DEG[m.id] ?? 0, r));
});
// ── state ──────────────────────────────────────────────────────
// acquired: { id: level }  — XP-bought magics
// lpBought: { id: true }   — magics bought at level 1 with LP (level upgrades still in acquired)
// specializations: { id: [spec1, spec2, spec3] } — free-text specializations unlocked at levels 4, 5, 6
// projects: [{ id, name, type, path: [nodeId,...] }] — mutation/familier/artefact projects (see PROJECT_TREE)
const state = { mode: 'planning', budget: 50, acquired: {}, lpBought: {}, specializations: {}, projects: [], improvements: [], selected: null, selectedProject: null };
const ns = 'http://www.w3.org/2000/svg';
const el = (tag, attrs={}, html='') => { const n = document.createElement(tag); Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v)); if (html) n.innerHTML = html; return n; };
const svgEl = (tag, attrs={}) => { const n = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v)); return n; };

  createBtn.disabled = !canCreate;

}

function render() { renderTopbar(); renderDetail(); renderSvg(); renderImprovements(); renderAcquired(); renderProjects(); renderDeleteProjectConfirmModal(); }
function buildSaveData() {
  return { mode: state.mode, budget: state.budget, acquired: state.acquired, lpBought: state.lpBought, specializations: state.specializations, projects: state.projects, improvements: state.improvements };
}
function saveState() {
  const blob = new Blob([JSON.stringify(buildSaveData(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'mage-build.json'; a.click(); URL.revokeObjectURL(url);
}
function applyState(d) {
  if (d.mode) state.mode = d.mode;
  if (typeof d.budget === 'number') state.budget = d.budget;
  if (d.acquired && typeof d.acquired === 'object') state.acquired = d.acquired;
  if (d.lpBought && typeof d.lpBought === 'object') state.lpBought = d.lpBought;
  state.specializations = (d.specializations && typeof d.specializations === 'object') ? d.specializations : {};
  state.projects = Array.isArray(d.projects) ? d.projects : [];
  state.projects.forEach((p) => {
    if (typeof p.offSchema !== 'boolean') p.offSchema = false;
    if (typeof p.offSchemaMax !== 'number') p.offSchemaMax = 0;
    if (!Array.isArray(p.offSchemaItems)) p.offSchemaItems = [];
  });
  state.improvements = Array.isArray(d.improvements) ? d.improvements : [];
  state.selected = null; state.selectedProject = null; render();
}
function loadState(file) {
  const fr = new FileReader();
  fr.onload = (ev) => {
    try { applyState(JSON.parse(ev.target.result)); }
    catch (e) { alert('Fichier JSON invalide'); }
  };
  fr.readAsText(file);
}

/* ================= Sauvegarde sur GitHub ================= */
// Valeurs par défaut : à modifier une fois avec ton compte / dépôt.
const GH_DEFAULTS = { owner: 'Idrur', repo: 'Crithemis-builder', folder: 'builds' };

function ghCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('gh_cfg') || '{}') || {}; } catch (e) {}
  return {
    owner: c.owner || GH_DEFAULTS.owner,
    repo: c.repo || GH_DEFAULTS.repo,
    folder: (c.folder || GH_DEFAULTS.folder).replace(/^\/+|\/+$/g, ''),
    token: c.token || ''
  };
}
function ghConfigured(cfg) {
  return !!cfg.owner && cfg.owner !== 'TON-USER' && !!cfg.repo && cfg.repo !== 'TON-REPO';
}
function ghFolderUrl(cfg) {
  const enc = encodeURIComponent;
  const path = cfg.folder ? '/' + cfg.folder.split('/').map(enc).join('/') : '';
  return `https://api.github.com/repos/${enc(cfg.owner)}/${enc(cfg.repo)}/contents${path}`;
}
function ghFileUrl(cfg, name) { return ghFolderUrl(cfg) + '/' + encodeURIComponent(name + '.json'); }
function ghHeaders(cfg, accept) {
  const h = { Accept: accept || 'application/vnd.github+json' };
  if (cfg.token) h.Authorization = 'Bearer ' + cfg.token;
  return h;
}
function ghError(res) {
  const m = {
    401: 'Token invalide ou expiré (🔑 pour le modifier).',
    403: 'Accès refusé (droits insuffisants ou limite de requêtes atteinte).',
    404: 'Dépôt, dossier ou fichier introuvable (ou token sans accès à ce dépôt).',
    409: 'Conflit : le fichier a été modifié entre-temps, réessaie.',
    422: 'Requête refusée par GitHub (nom de fichier invalide ?).'
  };
  return new Error(m[res.status] || ('Erreur GitHub ' + res.status));
}
function b64(str) { return btoa(unescape(encodeURIComponent(str))); }

function defaultBuildName() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `magic-build_${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}_${p(d.getHours())}:${p(d.getMinutes())}`;
}
function cleanBuildName(raw) {
  let n = (raw || '').trim().replace(/\.json$/i, '').replace(/[\\/?#%*"<>|]/g, '-').slice(0, 100).trim();
  return n || defaultBuildName();
}
async function ghGetSha(cfg, name) {
  const r = await fetch(ghFileUrl(cfg, name), { headers: ghHeaders(cfg), cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw ghError(r);
  return (await r.json()).sha;
}
function ghPut(cfg, name, data, sha) {
  const body = { message: `Sauvegarde du build « ${name} »`, content: b64(JSON.stringify(data, null, 2)) };
  if (sha) body.sha = sha;
  return fetch(ghFileUrl(cfg, name), { method: 'PUT', headers: ghHeaders(cfg), body: JSON.stringify(body) });
}
function buildTimestamp(name) {
  const m = name.match(/(\d{2})-(\d{2})-(\d{4})_(\d{2}):(\d{2})/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]).getTime() : null;
}

/* ---- petite modale générique ---- */
function ghCloseModal() { const o = document.getElementById('ghModalOverlay'); if (o) o.remove(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ghCloseModal(); });
function ghModal(title, buildBody) {
  ghCloseModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'ghModalOverlay';
  overlay.onclick = (e) => { if (e.target === overlay) ghCloseModal(); };
  const box = document.createElement('div'); box.className = 'modal-box';
  const header = document.createElement('div');
  header.style.cssText = 'padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;color:var(--gold);';
  header.textContent = title;
  const body = document.createElement('div'); body.className = 'panel-body';
  box.appendChild(header); box.appendChild(body); overlay.appendChild(box);
  document.body.appendChild(overlay);
  buildBody(body);
}
function ghField(body, label, type, value, placeholder) {
  const l = document.createElement('label'); l.className = 'gh-label'; l.textContent = label;
  const i = document.createElement('input'); i.className = 'gh-input'; i.type = type; i.value = value || ''; i.placeholder = placeholder || '';
  i.autocomplete = 'off'; i.spellcheck = false;
  body.appendChild(l); body.appendChild(i);
  return i;
}
function ghStatusEl(body) { const s = document.createElement('div'); s.className = 'gh-status'; body.appendChild(s); return s; }
function ghSetStatus(el, msg, kind) { el.textContent = msg; el.className = 'gh-status' + (kind ? ' ' + kind : ''); }
function ghButtons(body, buttons) {
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;margin-top:14px;';
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.className = 'btn ' + cls; b.style.cssText = 'font-size:12px;flex:1 1 auto;';
    b.textContent = label; b.onclick = () => fn(b); row.appendChild(b);
  });
  body.appendChild(row);
}
function ghHint(body, text) {
  const h = document.createElement('div'); h.className = 'hint'; h.style.cssText = 'font-size:12px;margin-bottom:4px;'; h.textContent = text; body.appendChild(h);
}

/* ---- configuration ---- */
function openGhConfig(reason) {
  const cfg = ghCfg();
  ghModal('🔑 Token GitHub', (body) => {
    if (reason) ghHint(body, reason);
    ghHint(body, 'Colle le token qui t\'a été communiqué. Il reste uniquement dans ce navigateur et n\'est nécessaire que pour sauvegarder (le chargement n\'en demande pas).');
    const iToken = ghField(body, 'Token GitHub', 'password', cfg.token, 'github_pat_… (laisser vide pour l\'effacer)');
    const st = ghStatusEl(body);
    ghButtons(body, [
      ['Annuler', '', () => ghCloseModal()],
      ['Enregistrer', 'gold', () => {
        try { localStorage.setItem('gh_cfg', JSON.stringify({ token: iToken.value.trim() })); }
        catch (e) { ghSetStatus(st, 'Impossible d\'enregistrer (stockage navigateur bloqué).', 'err'); return; }
        ghCloseModal();
      }]
    ]);
    iToken.focus();
  });
}

/* ---- sauvegarde ---- */
function openGhSave() {
  const cfg = ghCfg();
  if (!cfg.token) { openGhConfig('Un token GitHub est nécessaire pour sauvegarder.'); return; }
  ghModal('☁️ Sauvegarder sur GitHub', (body) => {
    const input = ghField(body, 'Nom du build', 'text', defaultBuildName(), '');
    ghHint(body, `Enregistré dans ${cfg.owner}/${cfg.repo}/${cfg.folder}/ (extension .json ajoutée automatiquement).`);
    const st = ghStatusEl(body);
    const doSave = async (btn) => {
      const name = cleanBuildName(input.value);
      btn.disabled = true; ghSetStatus(st, 'Envoi en cours…');
      try {
        let sha = await ghGetSha(cfg, name);
        if (sha && !confirm(`Un build nommé « ${name} » existe déjà. L'écraser ?`)) { btn.disabled = false; ghSetStatus(st, ''); return; }
        let res = await ghPut(cfg, name, buildSaveData(), sha);
        if (res.status === 409) { sha = await ghGetSha(cfg, name); res = await ghPut(cfg, name, buildSaveData(), sha); }
        if (!res.ok) throw ghError(res);
        ghSetStatus(st, `✅ Sauvegardé : ${name}.json`, 'ok');
        setTimeout(ghCloseModal, 1400);
      } catch (e) { btn.disabled = false; ghSetStatus(st, e.message || String(e), 'err'); }
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSave(body.querySelector('.btn.gold')); });
    ghButtons(body, [['Annuler', '', () => ghCloseModal()], ['Sauvegarder', 'gold', doSave]]);
    input.focus(); input.select();
  });
}

/* ---- chargement ---- */
function openGhLoad() {
  const cfg = ghCfg();
  ghModal('☁️ Charger depuis GitHub', (body) => {
    const st = ghStatusEl(body);
    ghSetStatus(st, 'Chargement de la liste…');
    const list = document.createElement('div'); list.className = 'gh-list'; list.style.marginTop = '8px';
    body.insertBefore(list, st);
    ghButtons(body, [['Fermer', '', () => ghCloseModal()]]);
    (async () => {
      try {
        const r = await fetch(ghFolderUrl(cfg), { headers: ghHeaders(cfg), cache: 'no-store' });
        if (r.status === 404) { ghSetStatus(st, 'Aucun build sauvegardé pour le moment.'); return; }
        if (!r.ok) throw ghError(r);
        const files = (await r.json()).filter((f) => f.type === 'file' && /\.json$/i.test(f.name))
          .map((f) => ({ name: f.name.replace(/\.json$/i, ''), ts: buildTimestamp(f.name) }));
        files.sort((a, b) => (b.ts ?? -1) - (a.ts ?? -1) || a.name.localeCompare(b.name));
        if (!files.length) { ghSetStatus(st, 'Aucun build sauvegardé pour le moment.'); return; }
        ghSetStatus(st, `${files.length} build(s) — clique pour charger.`);
        files.forEach((f) => {
          const b = document.createElement('button'); b.className = 'btn gh-item'; b.textContent = f.name;
          b.onclick = async () => {
            ghSetStatus(st, 'Chargement…');
            try {
              const rr = await fetch(ghFileUrl(cfg, f.name), { headers: ghHeaders(cfg, 'application/vnd.github.raw+json'), cache: 'no-store' });
              if (!rr.ok) throw ghError(rr);
              applyState(await rr.json());
              ghCloseModal();
            } catch (e) { ghSetStatus(st, e.message || String(e), 'err'); }
          };
          list.appendChild(b);
        });
      } catch (e) { ghSetStatus(st, e.message || String(e), 'err'); }
    })();
  });
}
document.getElementById('modePlanning').onclick = () => setMode('planning');
document.getElementById('modeBudget').onclick = () => setMode('budget');
document.getElementById('budgetInput').addEventListener('input', (e) => { state.budget = Math.max(0, +e.target.value || 0); render(); });
document.getElementById('saveBtn').onclick = saveState;
document.getElementById('ghSaveBtn').onclick = openGhSave;
document.getElementById('ghLoadBtn').onclick = openGhLoad;
document.getElementById('ghCfgBtn').onclick = () => openGhConfig();
document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', (e) => { const file = e.target.files && e.target.files[0]; if (file) loadState(file); e.target.value = ''; });
document.getElementById('resetBtn').onclick = () => { state.acquired = {}; state.lpBought = {}; state.specializations = {}; state.projects = []; state.improvements = []; state.selected = null; state.selectedProject = null; render(); };
document.getElementById('magicsHeader').onclick = () => toggleSection('magicsBody', 'magicsChevron');
document.getElementById('projectsHeader').onclick = () => toggleSection('projectsBody', 'projectsChevron');
function toggleSection(bodyId, chevronId) {
  const body = document.getElementById(bodyId);
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  document.getElementById(chevronId).textContent = collapsed ? '▾' : '▸';
}
render();
</script>
